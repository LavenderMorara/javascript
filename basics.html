 <!-- Linking  HTML to CSS
  syntax for basic css
    <link rel="stylesheet" href="fileName.css">
    example
    <link rel="stylesheet" href="style.css">
  When you wanna leverage tailwind cdn classes have the following link in your head tag
  <script src="https://cdn.tailwindcss.com"></script>
 then you can leverage it when creating a responsive ui  
   -->

<!-- Linking html to js - can be at the top or bottom provided you use defer attribute
syntax
  <script src="fileName.js" defer></script>
  defer makes js to kick in after html has loaded
  example
  <script src="week-1/functions.js" defer></script>
-->
